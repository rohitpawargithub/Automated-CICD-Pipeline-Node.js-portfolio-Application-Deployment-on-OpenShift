name: CI/CD - Build, Push & Deploy Portfolio to OpenShift

on:
  push:
    branches: [ "main" ]

env:
  IMAGE_NAME: portfolio-website
  OPENSHIFT_NAMESPACE: rohitpawar2003-dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  deploy-to-openshift:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install OpenShift CLI
        uses: redhat-actions/oc-installer@v1
        with:
          oc_version: "4.15"

      - name: Log in to OpenShift Cluster
        run: |
          oc login --token="${{ secrets.OPENSHIFT_TOKEN }}" \
                   --server="${{ secrets.OPENSHIFT_SERVER }}"

      - name: Set OpenShift Project
        run: |
          oc project "${{ env.OPENSHIFT_NAMESPACE }}"

      - name: Substitute Container Image Tag in Manifest
        run: |
          sed -i "s|DOCKER_IMAGE|docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s/deployment.yaml

      - name: Apply Kubernetes Manifests
        run: |
          oc apply -f k8s/ -n "${{ env.OPENSHIFT_NAMESPACE }}"

      - name: Verify Rollout Status
        run: |
          oc rollout status deployment/portfolio-website -n "${{ env.OPENSHIFT_NAMESPACE }}"
